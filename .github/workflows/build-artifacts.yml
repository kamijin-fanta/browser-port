name: Build Artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os_name: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os_name: macos
            runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Validate Tag Format
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag format: ${GITHUB_REF_NAME}" >&2
            echo "Expected format: vMAJOR.MINOR.PATCH (example: v0.1.0)" >&2
            exit 1
          fi

      - name: Resolve Version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/versioning/resolve-version
          ./scripts/versioning/resolve-version > "$RUNNER_TEMP/version.env"
          cat "$RUNNER_TEMP/version.env"
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            echo "$line" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/version.env"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            agent

      - name: Install WiX Toolset
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Build Windows Installer + Standalone
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          ./agent/installer/windows/build-msi.ps1 `
            -Target "${{ matrix.target }}" `
            -OutputDir "$PWD/agent/target/dist" `
            -Version "$env:FULL_VERSION" `
            -ManifestVersion "$env:RELEASE_VERSION"

      - name: Build Linux Installer + Standalone
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          chmod +x ./agent/installer/linux/build-tar.sh
          OUTPUT_DIR="$PWD/agent/target/dist" \
          TARGET_TRIPLE="${{ matrix.target }}" \
          VERSION="$FULL_VERSION" \
          MANIFEST_VERSION="$RELEASE_VERSION" \
          BROWSER_PORT_APP_VERSION="$FULL_VERSION" \
          ./agent/installer/linux/build-tar.sh

      - name: Build macOS Installer + Standalone
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          chmod +x ./agent/installer/macos/build-dmg.sh
          OUTPUT_DIR="$PWD/agent/target/dist" \
          TARGET_TRIPLE="${{ matrix.target }}" \
          VERSION="$FULL_VERSION" \
          MANIFEST_VERSION="$RELEASE_VERSION" \
          APP_VERSION="$RELEASE_VERSION" \
          BROWSER_PORT_APP_VERSION="$FULL_VERSION" \
          ./agent/installer/macos/build-dmg.sh

      - name: Package Chrome Extension
        shell: pwsh
        run: |
          $versionName = ""
          if ($env:IS_TAG_RELEASE -ne "true") {
            $versionName = $env:FULL_VERSION
          }
          ./extention/package-extension.ps1 `
            -OutputDir "$PWD/extention/target" `
            -Version "$env:FULL_VERSION" `
            -ManifestVersion "$env:RELEASE_VERSION" `
            -VersionName $versionName

      - name: Assemble Artifact Files
        shell: pwsh
        env:
          ARTIFACT_DIR: ci-artifacts/${{ matrix.os_name }}
        run: |
          $artifactDir = Join-Path $PWD $env:ARTIFACT_DIR
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $distDir = Join-Path $PWD "agent/target/dist"
          if (!(Test-Path $distDir)) {
            throw "Distribution directory not found: $distDir"
          }
          Get-ChildItem -Path $distDir -File | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $artifactDir -Force
          }

          $extDir = Join-Path $PWD "extention/target"
          $extensionZip = Get-ChildItem -Path $extDir -Filter "browser-port-chrome-extension-*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $extensionZip) {
            throw "Chrome extension zip was not generated"
          }
          Copy-Item -Path $extensionZip.FullName -Destination $artifactDir -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-port-${{ matrix.os_name }}
          path: ci-artifacts/${{ matrix.os_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Matrix Artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Collect Release Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          while IFS= read -r -d '' file; do
            cp "$file" "release-files/$(basename "$file")"
          done < <(find release-artifacts -type f -print0)
          ls -la release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-files/*
